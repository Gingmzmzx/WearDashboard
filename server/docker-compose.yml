services:
  gateway:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/gateway.db
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
